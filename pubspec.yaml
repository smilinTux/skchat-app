name: skchat
description: "SKChat — Sovereign Encrypted P2P Communication"
publish_to: 'none'

version: 1.1.3+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.6.0
  freezed_annotation: ^2.4.0
  
  # Navigation
  go_router: ^14.0.0
  
  # HTTP client for SKComm daemon
  dio: ^5.7.0
  
  # Local storage
  hive_flutter: ^1.1.0
  
  # Notifications & system
  flutter_local_notifications: ^18.0.0
  path_provider: ^2.1.0
  local_auth: ^2.3.0
  
  # QR codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  
  # Utils
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  
  # UI enhancements
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # Cryptography — pure-Dart RSA / AES primitives
  pointycastle: ^3.7.3

  # Post-quantum hybrid KEM (X25519 + ML-KEM-768). Web = @noble/post-quantum
  # via JS-interop (globalThis.skPqc); native = liboqs FFI (mobile follow-up).
  # PqDmCodec uses this to seal/open `pqdm1:` hybrid DM blobs (PQC-MIGRATION Q5).
  # The GitHub repo was renamed sk_pqc to sk-pqc-dart; the old URL only works
  # via a 301 redirect. Use the canonical URL so the declared contract
  # dependency resolves even without the dependency_overrides path below.
  sk_pqc:
    git:
      url: https://github.com/smilinTux/sk-pqc-dart

  # HKDF-SHA256 + AES-256-GCM for the PqDmCodec wrap (mirrors skcomms/pqdm.py).
  # Same package sk_pqc itself uses for the X25519 leg + HKDF combiner.
  cryptography: ^2.7.0

  # ASN1 encoding/decoding for DER key serialization
  asn1lib: ^1.5.0

  # Secure key storage (OS keychain / Keystore)
  flutter_secure_storage: ^9.0.0

  # Icons
  cupertino_icons: ^1.0.8

  # WebRTC voice/video calls
  flutter_webrtc: ^0.11.0
  web_socket_channel: ^3.0.0

  # LiveKit SFU client — group/agent room calls
  livekit_client: ^2.2.6

  # File picker for chat attachments (multipart upload to the daemon)
  file_picker: ^11.0.2
  web: ^1.1.0

  # Native synced watch-together playback (direct-file video on mobile/desktop;
  # the web surface uses HTML <video>/iframe embeds in watch_video_web.dart)
  video_player: ^2.9.0

  # SkMap tactical surface — OpenStreetMap tiles, no API key, offline-tile
  # capable (sovereignty: no Google/key dependency). flutter_map renders the
  # CoT/geo unit picture (ATAK-style) in the Ops surface.
  flutter_map: ^8.1.0
  # Lat/Lon value type used by flutter_map markers + camera.
  latlong2: ^0.9.1
  gpt_markdown: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  
  # Testing
  mocktail: ^1.0.0
  
  # Linting
  flutter_lints: ^6.0.0

# Build against the local sk_pqc checkout so the build is hermetic and uses the
# exact audited code. The published dependency above (git) is the contract; this
# override is dev/build convenience. Remove to pin the GitHub ref in CI.
#
# Points directly at the real `sk-pqc-dart` checkout (package name `sk_pqc`)
# rather than the stray `../sk_pqc` symlink, so the path resolves identically on
# any machine that has the sibling repo cloned.
dependency_overrides:
  sk_pqc:
    path: ../sk-pqc-dart

