name: skchat
description: "SKChat — Sovereign Encrypted P2P Communication"
publish_to: 'none'

version: 1.4.0+13

# Dart workspace root. Member packages resolve together under one shared
# lockfile (Dart >= 3.6; this repo is on 3.12). Step 1 of the workspace split
# (reconciled spec 3.2) added the module contract package; step 2 adds
# skchat_ui, the real package the grade-A skchat manifest points at, and the
# first extracted leaf feature (ChatMessage) with an export shim in lib/.
# Step 3 adds apps/skchat_standalone, the thin runner that hosts skchat_ui with
# a null shell (standalone mode) and deploys to :8088 until the umbrella
# cutover. Adding it as a member does not change the root app's own dependency
# set, so the deployed root-app web artifact stays byte-equivalent.
#
# packages/skcode_client and apps/skcode_standalone (card C-2, skworld code
# section architecture spec section 4.1) are the second consumer of
# skworld_module_api: the Grade A skcode module skeleton and its standalone
# runner. apps/skcode_standalone stays a workspace-only member (it does not
# mount skcode into the app shell; the module_registry.dart flip is card
# C-10, deliberately last). skcode_client IS added under the app's own
# `dependencies:` block below (card C-3b): the transport layer moved out of
# lib/services/skcode/ and into the package, so the host's Riverpod wiring
# (lib/services/skcode/skcode_providers.dart) now imports it directly.
workspace:
  - packages/skworld_module_api
  - packages/skchat_ui
  - apps/skchat_standalone
  - packages/skcode_client
  - apps/skcode_standalone

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # The skchat subapp UI, extracted into a workspace package (spec 3.2 step 2).
  # The app depends on it so the lib/models/chat_message.dart export shim
  # resolves `package:skchat_ui/...`; more feature surfaces move here over time.
  skchat_ui:
    path: packages/skchat_ui

  # The module UI-facet contract (ShellContext, SkworldModule). The app-side
  # live-feed adapter (lib/features/chats/live_chats_surface.dart) names
  # ShellContext when it bridges chatsProvider into SkchatModule (spec 3.2).
  skworld_module_api:
    path: packages/skworld_module_api

  # The skcode subapp's transport layer (card C-3, moved into the package by
  # C-3b): SkcodeApiClient, SkcodeSessionStore, SkcodeSessionsListStore,
  # SkcodeWsTransport. The host's Riverpod wiring
  # (lib/services/skcode/skcode_providers.dart) and its live-module factory
  # (lib/features/skcode/live_skcode_module.dart) import it directly.
  skcode_client:
    path: packages/skcode_client

  # State management
  flutter_riverpod: ^2.6.0
  freezed_annotation: ^2.4.0
  
  # Navigation
  go_router: ^14.0.0
  
  # HTTP client for SKComm daemon
  dio: ^5.7.0
  
  # Local storage
  hive_flutter: ^1.1.0
  
  # Notifications & system
  flutter_local_notifications: ^18.0.0
  path_provider: ^2.1.0
  local_auth: ^2.3.0
  
  # QR codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  
  # Utils
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  
  # UI enhancements
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # Cryptography — pure-Dart RSA / AES primitives
  pointycastle: ^3.7.3

  # Post-quantum hybrid KEM (X25519 + ML-KEM-768). Web = @noble/post-quantum
  # via JS-interop (globalThis.skPqc); native = liboqs FFI (mobile follow-up).
  # PqDmCodec uses this to seal/open `pqdm1:` hybrid DM blobs (PQC-MIGRATION Q5).
  # The GitHub repo was renamed sk_pqc to sk-pqc-dart; the old URL only works
  # via a 301 redirect. Use the canonical URL so the declared contract
  # dependency resolves even without the dependency_overrides path below.
  sk_pqc:
    git:
      url: https://github.com/smilinTux/sk-pqc-dart

  # HKDF-SHA256 + AES-256-GCM for the PqDmCodec wrap (mirrors skcomms/pqdm.py).
  # Same package sk_pqc itself uses for the X25519 leg + HKDF combiner.
  cryptography: ^2.7.0

  # ASN1 encoding/decoding for DER key serialization
  asn1lib: ^1.5.0

  # Secure key storage (OS keychain / Keystore)
  flutter_secure_storage: ^9.0.0

  # Icons
  cupertino_icons: ^1.0.8

  # WebRTC voice/video calls
  flutter_webrtc: ">=0.14.0 <2.0.0"
  web_socket_channel: ^3.0.0

  # LiveKit SFU client — group/agent room calls
  livekit_client: ">=2.4.0 <2.6.5"

  # File picker for chat attachments (multipart upload to the daemon)
  file_picker: ^11.0.2
  web: ^1.1.0

  # Native synced watch-together playback (direct-file video on mobile/desktop;
  # the web surface uses HTML <video>/iframe embeds in watch_video_web.dart)
  video_player: ^2.9.0

  # SkMap tactical surface — OpenStreetMap tiles, no API key, offline-tile
  # capable (sovereignty: no Google/key dependency). flutter_map renders the
  # CoT/geo unit picture (ATAK-style) in the Ops surface.
  flutter_map: ^8.1.0
  # Lat/Lon value type used by flutter_map markers + camera.
  latlong2: ^0.9.1
  gpt_markdown: ^1.1.7
  crypto: ^3.0.7
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  
  # Testing
  mocktail: ^1.0.0
  fake_async: ^1.3.1

  # Autonomous in-process UI driving (integration_test/), see SP5 harness.
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

# Build against the local sk_pqc checkout so the build is hermetic and uses the
# exact audited code. The published dependency above (git) is the contract; this
# override is dev/build convenience. Remove to pin the GitHub ref in CI.
#
# Points directly at the real `sk-pqc-dart` checkout (package name `sk_pqc`)
# rather than the stray `../sk_pqc` symlink, so the path resolves identically on
# any machine that has the sibling repo cloned.
dependency_overrides:
  sk_pqc:
    path: ../sk-pqc-dart

  # --- Linux system-audio (loopback) capture -------------------------------
  # Upstream flutter_webrtc ships an unimplemented Linux LoopbackCapturer stub
  # (returns nullptr), so getDisplayMedia({audio:true}) gets no system audio on
  # Linux. Our fork adds a PulseAudio/PipeWire monitor-capture backend
  # (linux/pulse_loopback_capturer.*) and is proposed upstream in
  # flutter-webrtc/flutter-webrtc#2115. Pinned to the fork commit so every
  # checkout resolves without a local sibling clone. The Linux plugin build
  # needs the libpulse dev package present; without it the plugin still builds
  # and simply yields no system-audio track. Drop this override once the change
  # lands in an upstream release.
  flutter_webrtc:
    git:
      url: https://github.com/smilinTux/flutter-webrtc.git
      ref: a7db44d9fcdfc0b0321ad0224c45ab2116aa7d99

