name: skcode_client
description: >-
  The skcode subapp UI facet: SkcodeModule (implements SkworldModule) and the
  empty shell surface that proves the mount. This is the Grade A package the
  skcode manifest's entry.flutter_package will point at once the registry flip
  (card C-10) lands. Phase 1 skeleton only (card C-2, spec section 4.1): it
  proves the mount pattern and the standalone boot, no transcript/session/WS
  code yet (that is C-3 and C-4). It depends ONLY on skworld_module_api and
  Flutter, never on a shell package (enforced by the import gate).
version: 0.0.1
publish_to: 'none'

# Resolves as a member of the skworld-app Dart workspace (root pubspec.yaml
# `workspace:` list). One shared lockfile at the workspace root.
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"

dependencies:
  # The UI-facet contract this module implements. This is the ONLY non-Flutter
  # dependency allowed to cross the boundary (import gate proves it).
  skworld_module_api:
    path: ../skworld_module_api
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
